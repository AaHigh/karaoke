  document.documentElement.style.setProperty('--playtop', ((hdr && hdr.offsetHeight) || 52) + 'px');
}
function markPlaying() { document.body.classList.add('playing'); setPerform(true); }
function knownEmbed(id) {
  if (BUILTIN_BY_ID[id]) return BUILTIN_BY_ID[id].e;
  return currentPlid === DEFAULT_PLAYLIST ? 1 : 0;
}
function isJunkSong(s) {
  var id = s.id || '';
  var title = (s.t || '').trim();
  var author = (s.c || '').trim();
  var dur = s.d || '';
  var idLike = /^[A-Za-z0-9_-]{11}$/.test(title);
  var zero = !dur || dur === '0:00' || dur === '0';

function parseSeconds(d) {
  var parts = String(d || '0').split(':').map(function(n) { return parseInt(n, 10) || 0; });
  if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
  if (parts.length === 2) return parts[0] * 60 + parts[1];
  return parts[0];
}
function songBits(title) {
  var raw = String(title || '').replace(/\s+/g, ' ').trim();
  raw = raw.replace(/\s*[\(\[][^)\]]*(karaoke|instrumental|lyrics|official|version|hd)[^)\]]*[\)\]]/ig, ' ');
  raw = raw.replace(/\s*[-|•·]+\s*(karaoke|instrumental).*$/i, ' ');
  raw = raw.replace(/\s+/g, ' ').replace(/^[-|•· ]+|[-|•· ]+$/g, '');
  var artist = '';
  var song = raw;
  var seps = [' - ', ' – ', ' — ', ' • ', ' · ', ' | '];
  for (var i = 0; i < seps.length; i++) {
    if (raw.indexOf(seps[i]) !== -1) {

      artist = parts.shift().trim();
      song = parts.join(seps[i]).trim();

function sortedSongs(rows) {
  var base = rows.map(function(s, i) { return Object.assign({}, s, { _i: s._i != null ? s._i : i }); });
  if (sortMode === 0) return base.slice().sort(function(a, b) { return a._i - b._i; });
  if (sortMode === 3) return base.slice().sort(function(a, b) { return parseSeconds(a.d) - parseSeconds(b.d) || a._i - b._i; });
  if (sortMode === 2) {
    return base.slice().sort(function(a, b) {
      var an = songBits(a.t).song.toLowerCase();
      var bn = songBits(b.t).song.toLowerCase();
      if (an < bn) return -1;
      if (an > bn) return 1;
      return a._i - b._i;
    });
  }
  var counts = {};
  base.forEach(function(s) {
    var a = (songBits(s.t).artist || s.c || 'Unknown').toLowerCase();
    counts[a] = (counts[a] || 0) + 1;
  });
  return base.slice().sort(function(a, b) {
    var aa = (songBits(a.t).artist || a.c || 'Unknown').toLowerCase();
    var bb = (songBits(b.t).artist || b.c || 'Unknown').toLowerCase();
    if (counts[bb] !== counts[aa]) return counts[bb] - counts[aa];
    if (aa < bb) return -1;
    if (aa > bb) return 1;

}
function extractPlaylistId(text) {
  if (!text) return null;
  var s = String(text).replace(/\s+/g, ' ').trim();
  var m = s.match(/[?&]list=([A-Za-z0-9_-]+)/);
  if (m) return m[1];
  m = s.match(/\b(PL[A-Za-z0-9_-]{10,}|OLAK5[A-Za-z0-9_-]+|UU[A-Za-z0-9_-]{20,}|FL[A-Za-z0-9_-]{20,})\b/);
  if (m) return m[1];

function loadBlockedIds() {
  try { return JSON.parse(localStorage.getItem(STORE_BLOCKED) || '{}'); } catch (e) { return {}; }
}
function rememberBlockedId(id) {
  var b = loadBlockedIds();
  b[id] = 1;
  try { localStorage.setItem(STORE_BLOCKED, JSON.stringify(b)); } catch (e) {}
}
function applyBlockedFlags(songs) {
  var b = loadBlockedIds();
  songs.forEach(function(s) { if (b[s.id]) s.e = 0; });
  return songs;
}
function persistCurrent() {
  try {
    localStorage.setItem(STORE, JSON.stringify({
      songs: SONGS, label: sourceLabel, plid: currentPlid, name: currentName, at: Date.now()
    }));
  } catch (e) {}
}
function loadDefault() {
  try { return JSON.parse(localStorage.getItem(STORE_DEFAULT) || 'null'); } catch (e) { return null; }
}
function loadSavedPlaylists() {
  var extra = [];
  try { extra = JSON.parse(localStorage.getItem(STORE_SAVED) || '[]'); } catch (e) { extra = []; }
  var out = [];
  var seen = {};
  PLAYLISTS.concat(extra).forEach(function(item) {
    if (!item || !item.id || seen[item.id]) return;
    seen[item.id] = 1;
    out.push({ id: item.id, name: item.name || item.id, home: !!item.home });
  });
  return out;
}
function rememberPlaylist(id, name) {
  if (!id) return;
  var rows = loadSavedPlaylists();
  if (rows.some(function(item) { return item.id === id; })) { renderPicks(); return; }
  rows.push({ id: id, name: name || id });
  var extras = rows.filter(function(item) { return !PLAYLISTS.some(function(h) { return h.id === item.id; }); });
  try { localStorage.setItem(STORE_SAVED, JSON.stringify(extras)); } catch (e) {}
  renderPicks();
}
function renderPicks() {
  var box = document.getElementById('picks');
  var def = loadDefault();
  var defId = def && def.plid;
  box.innerHTML = loadSavedPlaylists().map(function(item) {
    var mark = (defId && defId === item.id) ? ' *' : '';
    return '<button type="button" data-plid="' + item.id + '">' + esc(item.name) + mark + '</button>';
  }).join('');
  box.querySelectorAll('button').forEach(function(btn) {
    btn.classList.toggle('on', btn.getAttribute('data-plid') === currentPlid);
  });
}
function applySongs(songs, label, plid, name) {
  closePlayer();
  SONGS = applyBlockedFlags(songs.filter(function(s) { return !isJunkSong(s); }).map(function(s, i) {
    return Object.assign({}, s, { _i: i });
  }));
  sourceLabel = label;
  if (plid) currentPlid = plid;
  if (name) currentName = name;
  persistCurrent();
  renderPicks();
  render();
}
function filtered() {
  var query = q.value;
  var searching = tokens(query).length > 0;
  var rows = SONGS.filter(function(s) {
    if (isJunkSong(s)) return false;
    if (!matches(s, query)) return false;
    if (searching) return true;
    if (filter === 'here' && !s.e) return false;
    if (filter === 'yt' && s.e) return false;
    return true;
  });
  return sortedSongs(rows);
}
function persistCurrent() {
  try {
    localStorage.setItem(STORE, JSON.stringify({
      songs: SONGS, label: sourceLabel, plid: currentPlid, name: currentName, at: Date.now()
    }));
  } catch (e) {}
}
function destroyPlayer() {
  switchingTrack = true;
  if (window.ytPlayer) {
    try { window.ytPlayer.destroy(); } catch (e) {}
    window.ytPlayer = null;
  }
  stageFrame.innerHTML = '';
}
function closePlayer() {
  destroyPlayer();
  stage.classList.remove('open');
  activeId = null;
  document.body.classList.remove('theater');
  document.body.classList.remove('playing');
  document.querySelectorAll('.row.now').forEach(function(el) { el.classList.remove('now'); });
}
function showYtOnly(song) {
  destroyPlayer();
  activeId = song.id;
  stage.classList.add('open');
  markPlaying();
  stageTitle.textContent = song.t;
  stageBy.textContent = (song.c ? song.c + ' · ' : '') + (song.d || '');
  openYt.href = 'https://www.youtube.com/watch?v=' + song.id;
  var box = document.createElement('div');
  box.className = 'yt-fallback';
  box.innerHTML = '<p>This one cannot play here. Marked YT for next time.</p><a href="https://www.youtube.com/watch?v=' + song.id + '">Open in YouTube</a>';
  stageFrame.appendChild(box);
  document.querySelectorAll('.row.now').forEach(function(el) { el.classList.remove('now'); });
  var row = document.querySelector('.row[data-id="' + song.id + '"]');
  if (row) row.classList.add('now');
}
function openYouTube(song) {
  window.location.href = 'https://www.youtube.com/watch?v=' + song.id;
}
function playHere(song) {
  if (!song) return;
  if (!song.e) { openYouTube(song); return; }
  activeId = song.id;
  stage.classList.add('open');
  markPlaying();
  stageTitle.textContent = song.t;
  stageBy.textContent = (song.c ? song.c + ' · ' : '') + (song.d || '');
  openYt.href = 'https://www.youtube.com/watch?v=' + song.id;
  document.querySelectorAll('.row.now').forEach(function(el) { el.classList.remove('now'); });
  var row = document.querySelector('.row[data-id="' + song.id + '"]');
  if (row) row.classList.add('now');
  switchingTrack = true;
  if (window.ytPlayer && typeof window.ytPlayer.loadVideoById === 'function') {
    try {
      window.ytPlayer.loadVideoById(song.id);
      setTimeout(function() { switchingTrack = false; }, 1000);
      syncTheater();
      return;
    } catch (err) {}
  }
  destroyPlayer();
  var holder = document.createElement('div');
  holder.id = 'yt-holder';
  stageFrame.appendChild(holder);
  function start() {
    if (!(window.YT && YT.Player)) return false;
    window.ytPlayer = new YT.Player('yt-holder', {
      width: '100%',
      height: '100%',
      videoId: song.id,
      playerVars: { autoplay: 1, playsinline: 1, rel: 0, fs: 1, modestbranding: 1 },
      events: {
        onReady: function(ev) {
          switchingTrack = false;
          try { ev.target.playVideo(); } catch (err) {}
        },
        onStateChange: function(ev) {
          if (switchingTrack) return;
          if (ev.data === 0 && !oneTrack) setTimeout(playNextHere, 50);
        },
        onError: function() {
          song.e = 0;
          rememberBlockedId(song.id);
          persistCurrent();
          render();
          if (!oneTrack) {
            switchingTrack = false;
            setTimeout(playNextHere, 50);
          } else {
            showYtOnly(song);
          }
        }
      }

    return true;
  }
  if (!start()) {
    var iframe = document.createElement('iframe');
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen';

    iframe.title = song.t;
    iframe.src = 'https://www.youtube.com/embed/' + song.id + '?autoplay=1&playsinline=1&rel=0&fs=1';

    stageFrame.appendChild(iframe);
    switchingTrack = false;
  }
  syncTheater();

function playNextHere() {
  var queue = sortedSongs(SONGS.filter(function(s) { return !isJunkSong(s) && matches(s, q.value) && s.e; }));
  if (!queue.length) { closePlayer(); return; }
  var cur = SONGS.find(function(s) { return s.id === activeId; });
  var curI = cur && cur._i != null ? cur._i : -1;
  var idx = queue.findIndex(function(s) { return s.id === activeId; });
  var next = null;
  if (idx >= 0) next = queue[idx + 1] || null;
  else next = queue.find(function(s) { return (s._i != null ? s._i : 0) > curI; }) || null;

  else closePlayer();
}
async function readClipboard() {
  try {
    if (navigator.clipboard && navigator.clipboard.readText) return await navigator.clipboard.readText();
  } catch (e) {}
  return '';
}
function songFromVideo(v) {
  var id = v.videoId;
  var b = BUILTIN_BY_ID[id];
  var sec = v.lengthSeconds;
  return {
    id: id,
    t: v.title || (b && b.t) || id,
    c: v.author || (b && b.c) || '',
    d: sec != null ? (Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0')) : ((b && b.d) || ''),
    e: knownEmbed(id),
    g: [v.description || '', b && b.t, b && b.c, b && b.g].filter(Boolean).join(' ')

async function fetchPlaylist(plid) {
  var lastErr = 'no host';
  for (var h = 0; h < HOSTS.length; h++) {
    var host = HOSTS[h];
    try {
      var songs = [];
      var seen = {};
      var title = plid;
      for (var page = 1; page <= 10; page++) {
        var res = await fetch(host + '/api/v1/playlists/' + plid + '?page=' + page, { headers: { Accept: 'application/json' } });
        if (!res.ok) { lastErr = host + ' ' + res.status; break; }
        var data = await res.json();
        title = data.title || title;
        var raw = data.videos || [];
        var fresh = 0;
        raw.forEach(function(v) {
          var id = v.videoId;
          if (!id || seen[id]) return;
          var song = songFromVideo(v);
          if (isJunkSong(song)) { seen[id] = 1; return; }
          seen[id] = 1;
          songs.push(song);
          fresh += 1;
        });
        if (!raw.length || fresh === 0) break;
      }
      if (songs.length) return { title: title, songs: songs };
      lastErr = host + ' empty';
    } catch (e) {
      lastErr = host + ' fail';
    }
  }
  throw new Error(lastErr);
}
async function loadPlaylistById(plid, name, via) {
  setStatus('Loading ' + (name || 'playlist') + '.');
  var data = await fetchPlaylist(plid);
  var labelName = name || data.title || plid;
  applySongs(data.songs, labelName + ' · ' + data.songs.length + ' songs', plid, labelName);
  rememberPlaylist(plid, labelName);
  var def = loadDefault();
  if (def && def.plid === plid) {
    try { localStorage.setItem(STORE_DEFAULT, JSON.stringify({ plid: plid, name: labelName, songs: data.songs, at: Date.now() })); } catch (e) {}
  }
  setStatus((via ? via + ' · ' : '') + 'Loaded ' + data.songs.length + ' songs from ' + labelName + '.');
  setPerform(true);
}
async function updateList() {
  var btn = document.getElementById('update');
  btn.disabled = true;
  setStatus('Checking clipboard.');
  var clip = await readClipboard();
  var fromClip = extractPlaylistId(clip);
  try {
    if (fromClip) await loadPlaylistById(fromClip, 'Clipboard playlist', 'Clipboard');
    else await loadPlaylistById(currentPlid || DEFAULT_PLAYLIST, currentName || HOME_NAME, 'Selected list');
  } catch (e) {
    setStatus('Update failed. Built-in list is still here.');
  }
  btn.disabled = false;
}
function makeDefault() {
  try { localStorage.setItem(STORE_DEFAULT, JSON.stringify({ plid: currentPlid, name: currentName, songs: SONGS, at: Date.now() })); } catch (e) {}
  rememberPlaylist(currentPlid, currentName);
  setStatus('Defaulting to ' + currentName + ' instead of AAHIGH on the next load.');
  renderPicks();
}
function useBuiltin() {
  try {
    localStorage.removeItem(STORE);
    localStorage.removeItem(STORE_DEFAULT);
    localStorage.removeItem('aahighKaraoke.v2');
    localStorage.removeItem('aahighKaraoke.v1');
  } catch (e) {}
  applySongs(BUILTIN.map(copySong), 'Built-in AAHIGH list', DEFAULT_PLAYLIST, HOME_NAME);
  setStatus('Restored hard-coded AAHIGH list. That is the default again.');
}
function render() {
  var rows = filtered();
  var queryOn = tokens(q.value).length > 0;
  var hereCount = rows.filter(function(s) { return s.e; }).length;
  count.textContent = sourceLabel + ' · ' + rows.length + (queryOn ? ' matches' : ' shown') + ' of ' + SONGS.length + ' · ' + hereCount + ' play here';
  if (!rows.length) {
    list.innerHTML = '<div class="empty">No matches in this playlist.</div>';
    return;
  }
  list.innerHTML = rows.map(function(s, i) {
    return '<button type="button" class="row' + (s.id === activeId ? ' now' : '') + '" data-id="' + s.id + '">' +
      '<img class="thumb" src="https://i.ytimg.com/vi/' + s.id + '/mqdefault.jpg" alt="">' +
      '<div class="info"><div class="title">' + (i + 1) + '. ' + esc(s.t) + '</div><div class="by">' + esc(s.c) + ' · ' + esc(s.d) + '</div></div>' +
      '<span class="badge' + (s.e ? ' ok' : '') + '">' + (s.e ? 'HERE' : 'YT') + '</span></button>';
  }).join('');
}

list.addEventListener('click', function(e) {
  var row = e.target.closest('.row');
  if (!row) return;
  var song = SONGS.find(function(s) { return s.id === row.dataset.id; });

document.getElementById('close').addEventListener('click', closePlayer);
document.getElementById('onetrack').addEventListener('click', function() {

function setFilter() {

  document.getElementById('f-yt').classList.toggle('on', filter === 'yt');

}
q.addEventListener('input', render);
window.addEventListener('resize', function() { syncTheater(); if (document.body.classList.contains('playing')) markPlaying(); });
window.addEventListener('orientationchange', function() { setTimeout(syncTheater, 250); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', syncTheater);

(function init() {
  try {
    var ot = localStorage.getItem('aahighKaraoke.oneTrack');
    if (ot === '0') oneTrack = false;
    if (ot === '1') oneTrack = true;
  } catch (e) {}
  var otBtn = document.getElementById('onetrack');
  if (otBtn) otBtn.classList.toggle('on', oneTrack);
  var def = loadDefault();
  if (def && Array.isArray(def.songs) && def.songs.length) {
    SONGS = applyBlockedFlags(def.songs.map(function(s) {
      return { id: s.id, t: s.t, c: s.c, d: s.d, e: s.e, g: s.g || '' };
    })).filter(function(s) { return !isJunkSong(s); }).map(function(s, i) {
      return Object.assign({}, s, { _i: i });
    });
    currentPlid = def.plid || DEFAULT_PLAYLIST;
    currentName = def.name || 'Saved playlist';

  } else {
    currentPlid = DEFAULT_PLAYLIST;
    currentName = HOME_NAME;
    sourceLabel = 'Built-in AAHIGH list';
    SONGS = applyBlockedFlags(BUILTIN.map(copySong)).filter(function(s) { return !isJunkSong(s); }).map(function(s, i) {
      return Object.assign({}, s, { _i: i });
    });
  }

})();
