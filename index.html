<style>
:root {
  --bg: #0b0b0f;

  --accent: #e8b84a;

  --ok: #3dd68c;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}
body { padding-bottom: env(safe-area-inset-bottom); }
header {
  position: sticky; top: 0; z-index: 30;
  background: rgba(11,11,15,.96);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.bar { padding: 12px 14px 10px; }
h1 { font-size: 15px; letter-spacing: .12em; margin: 0; font-weight: 700; }
.sub { color: var(--muted); font-size: 12px; margin: 4px 0 10px; line-height: 1.4; }
.sub a { color: var(--accent); text-decoration: none; }
#q {
  width: 100%; font-size: 16px;
  background: var(--card); color: var(--ink);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; outline: none;
}
#q:focus { border-color: var(--accent); }
.filters { display: flex; gap: 8px; margin-top: 8px; }
.filters button {
  flex: 1; font-size: 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink);
  padding: 7px 8px;
}
.filters button.on { border-color: var(--accent); color: var(--accent); }
#count { color: var(--muted); font-size: 12px; margin-top: 8px; }
#stage {
  display: none;
  background: #000;
  border-top: 1px solid var(--line);
}
#stage.open { display: block; }
.stage-frame { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; }
.stage-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.stage-meta { padding: 8px 14px 10px; background: #111116; }
.stage-title { font-size: 14px; font-weight: 650; }
.stage-by { color: var(--muted); font-size: 12px; margin-top: 2px; }
.stage-actions { display: flex; gap: 14px; margin-top: 8px; }
.stage-actions button, .stage-actions a {
  font-size: 12px; color: var(--accent);
  background: none; border: 0; padding: 0;
  text-decoration: none;
}
main { padding: 10px 12px 40px; max-width: 720px; margin: 0 auto; }
.row {
  display: flex; gap: 10px; align-items: center;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  margin-bottom: 8px;
  padding: 8px;
  width: 100%;
  text-align: left;
  color: inherit;
}
.row.now { outline: 2px solid var(--accent); }
.thumb {
  width: 96px; height: 54px; border-radius: 8px; object-fit: cover;
  background: #000; flex: 0 0 96px;
}
.info { min-width: 0; flex: 1; }
.title { font-size: 14px; line-height: 1.3; font-weight: 650; }
.by { color: var(--muted); font-size: 11px; margin-top: 3px; }
.badge {
  flex: 0 0 auto;
  font-size: 10px; letter-spacing: .04em;
  border-radius: 999px; padding: 4px 7px;
  border: 1px solid var(--line); color: var(--muted);
}
.badge.ok { color: var(--ok); border-color: #1e5c40; }
.empty { color: var(--muted); text-align: center; padding: 40px 10px; }

/* Landscape theater: player fills the phone. List and search hide. */
body.theater .bar,
body.theater main { display: none; }
body.theater header {
  position: static;
  border: 0;
  background: #000;
}
body.theater #stage,
body.theater #stage.open {
  display: flex;
  flex-direction: column;
  position: fixed;
  inset: 0;
  z-index: 80;
  background: #000;
  border: 0;
}
body.theater .stage-frame {
  flex: 1 1 auto;
  aspect-ratio: auto;
  width: 100%;
  height: auto;
}
body.theater .stage-meta {
  flex: 0 0 auto;
  padding: 6px 12px calc(8px + env(safe-area-inset-bottom));
}
</style>
</head>

const list = document.getElementById('list');
const q = document.getElementById('q');
const count = document.getElementById('count');
const stage = document.getElementById('stage');
const stageFrame = document.getElementById('stage-frame');
const stageTitle = document.getElementById('stage-title');
const stageBy = document.getElementById('stage-by');
const openYt = document.getElementById('open-yt');
let filter = 'all';
let activeId = null;

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function isLandscape() {
  const w = window.visualViewport ? window.visualViewport.width : window.innerWidth;
  const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  if (window.matchMedia) {
    if (window.matchMedia('(orientation: landscape)').matches) return true;
  }
  return w > h;
}

function syncTheater() {
  const on = !!activeId && isLandscape();
  document.body.classList.toggle('theater', on);
}

function filtered() {
  const n = q.value.trim().toLowerCase();
  return SONGS.filter(s => {
    if (filter === 'here' && !s.e) return false;
    if (filter === 'yt' && s.e) return false;
    if (!n) return true;
    return (s.t + ' ' + s.c).toLowerCase().includes(n);
  });
}

function destroyPlayer() {
  stageFrame.innerHTML = '';
}

function closePlayer() {
  destroyPlayer();
  stage.classList.remove('open');
  activeId = null;
  document.body.classList.remove('theater');
  document.querySelectorAll('.row.now').forEach(el => el.classList.remove('now'));
}

function playHere(song) {
  destroyPlayer();
  activeId = song.id;
  stage.classList.add('open');
  stageTitle.textContent = song.t;
  stageBy.textContent = song.c + ' · ' + song.d;
  openYt.href = 'https://www.youtube.com/watch?v=' + song.id;
  const iframe = document.createElement('iframe');
  iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen';
  iframe.setAttribute('allowfullscreen', '');
  iframe.setAttribute('webkitallowfullscreen', '');
  iframe.title = song.t;
  iframe.src = 'https://www.youtube.com/embed/' + song.id + '?autoplay=1&playsinline=1&rel=0&fs=1';
  stageFrame.appendChild(iframe);
  document.querySelectorAll('.row.now').forEach(el => el.classList.remove('now'));
  const row = document.querySelector('.row[data-id="' + song.id + '"]');
  if (row) row.classList.add('now');
  syncTheater();
  if (!document.body.classList.contains('theater')) {
    stage.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function openYouTube(song) {
  closePlayer();
  window.location.href = 'https://www.youtube.com/watch?v=' + song.id;
}

function render() {
  const rows = filtered();
  const here = rows.filter(s => s.e).length;
  count.textContent = rows.length + ' shown · ' + here + ' play here · ' + (rows.length - here) + ' open YouTube';
  if (!rows.length) {
    list.innerHTML = '<div class="empty">No matches.</div>';
    return;
  }
  list.innerHTML = rows.map((s, i) =>
    '<button type="button" class="row' + (s.id === activeId ? ' now' : '') + '" data-id="' + s.id + '">' +
      '<img class="thumb" src="https://i.ytimg.com/vi/' + s.id + '/mqdefault.jpg" alt="">' +
      '<div class="info">' +
        '<div class="title">' + (i + 1) + '. ' + esc(s.t) + '</div>' +
        '<div class="by">' + esc(s.c) + ' · ' + esc(s.d) + '</div>' +
      '</div>' +
      '<span class="badge' + (s.e ? ' ok' : '') + '">' + (s.e ? 'HERE' : 'YT') + '</span>' +
    '</button>'
  ).join('');
}

list.addEventListener('click', (e) => {
  const row = e.target.closest('.row');
  if (!row) return;
  const song = SONGS.find(s => s.id === row.dataset.id);
  if (!song) return;
  if (song.e) playHere(song);
  else openYouTube(song);
});

document.getElementById('close').addEventListener('click', closePlayer);
document.getElementById('f-all').addEventListener('click', () => { filter = 'all'; setFilter(); });
document.getElementById('f-here').addEventListener('click', () => { filter = 'here'; setFilter(); });
document.getElementById('f-yt').addEventListener('click', () => { filter = 'yt'; setFilter(); });
function setFilter() {
  document.getElementById('f-all').classList.toggle('on', filter === 'all');
  document.getElementById('f-here').classList.toggle('on', filter === 'here');
  document.getElementById('f-yt').classList.toggle('on', filter === 'yt');
  render();
}
q.addEventListener('input', render);
window.addEventListener('resize', syncTheater);
window.addEventListener('orientationchange', () => setTimeout(syncTheater, 250));
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', syncTheater);
}
if (window.screen && screen.orientation && screen.orientation.addEventListener) {
  screen.orientation.addEventListener('change', () => setTimeout(syncTheater, 250));
}
render();
</script>
